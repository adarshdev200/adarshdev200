<svg xmlns="http://www.w3.org/2000/svg"
    width="900"
    height="360"
    viewBox="0 0 900 360">

  <rect width="100%" height="100%" rx="14"
        fill="#0d1117"
        stroke="#30363d"/>

  <!-- Terminal title bar -->
  <rect width="100%" height="48"
        rx="14"
        fill="#161b22"/>

  <circle cx="22" cy="24" r="6" fill="#ff5f56"/>
  <circle cx="42" cy="24" r="6" fill="#ffbd2e"/>
  <circle cx="62" cy="24" r="6" fill="#27c93f"/>

  <text x="90" y="30"
        fill="#8b949e"
        font-family="monospace"
        font-size="15">
    avi@github ~ $ whoami
  </text>


  <text x="38" y="92"
        fill="#58a6ff"
        font-family="monospace"
        font-size="17"
        font-weight="bold"
        opacity="0">
    Now:
    <animate attributeName="opacity"
             from="0" to="1"
             begin="0.0s"
             dur="0.5s"
             fill="freeze"/>
  </text>

  <text x="180" y="92"
        fill="#c9d1d9"
        font-family="monospace"
        font-size="16"
        opacity="0">
    Learning AI/ML • Exploring AI Engineer roles • Exploring LLMs &amp; RAG
    <animate attributeName="opacity"
             from="0" to="1"
             begin="0.0s"
             dur="0.5s"
             fill="freeze"/>
  </text>

  <text x="38" y="154"
        fill="#58a6ff"
        font-family="monospace"
        font-size="17"
        font-weight="bold"
        opacity="0">
    Prev:
    <animate attributeName="opacity"
             from="0" to="1"
             begin="0.25s"
             dur="0.5s"
             fill="freeze"/>
  </text>

  <text x="180" y="154"
        fill="#c9d1d9"
        font-family="monospace"
        font-size="16"
        opacity="0">
    Freelancing • Built 3–4 projects for real clients
    <animate attributeName="opacity"
             from="0" to="1"
             begin="0.25s"
             dur="0.5s"
             fill="freeze"/>
  </text>

  <text x="38" y="216"
        fill="#58a6ff"
        font-family="monospace"
        font-size="17"
        font-weight="bold"
        opacity="0">
    Stack:
    <animate attributeName="opacity"
             from="0" to="1"
             begin="0.5s"
             dur="0.5s"
             fill="freeze"/>
  </text>

  <text x="180" y="216"
        fill="#c9d1d9"
        font-family="monospace"
        font-size="16"
        opacity="0">
    Python • Java • React • HTML • CSS • Node.js • Tailwind CSS • Git • Docker
    <animate attributeName="opacity"
             from="0" to="1"
             begin="0.5s"
             dur="0.5s"
             fill="freeze"/>
  </text>

  <text x="38" y="278"
        fill="#58a6ff"
        font-family="monospace"
        font-size="17"
        font-weight="bold"
        opacity="0">
    Highlights:
    <animate attributeName="opacity"
             from="0" to="1"
             begin="0.75s"
             dur="0.5s"
             fill="freeze"/>
  </text>

  <text x="180" y="278"
        fill="#c9d1d9"
        font-family="monospace"
        font-size="16"
        opacity="0">
    AI/ML • LLMs • RAG • Real-world client projects
    <animate attributeName="opacity"
             from="0" to="1"
             begin="0.75s"
             dur="0.5s"
             fill="freeze"/>
  </text>

</svg>
